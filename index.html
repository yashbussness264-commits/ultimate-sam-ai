<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b16">
  <title>SAM AI — Personal Assistant</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #12325a, #050812 68%);
      color: #eaf6ff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 22px 10px;
      color: #63dfff;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .core {
      width: 155px;
      height: 155px;
      margin: 25px auto;
      border: 2px solid #39cfff;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle, #164b78, #071225 70%);
      box-shadow: 0 0 30px #168bdc, inset 0 0 25px #168bdc;
      animation: pulse 3s infinite;
    }

    .core span {
      font-size: 42px;
      text-shadow: 0 0 18px #55dfff;
    }

    @keyframes pulse {
      50% { transform: scale(1.04); }
    }

    #status {
      color: #73dfff;
      font-size: 12px;
      letter-spacing: 2px;
      margin: 15px;
    }

    .chat {
      width: 92%;
      max-width: 520px;
      margin: 20px auto;
      padding: 16px;
      border: 1px solid #1b4565;
      border-radius: 18px;
      background: #0a1423;
    }

    #reply {
      min-height: 70px;
      max-height: 40vh;
      overflow-y: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
      text-align: left;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #27577c;
      border-radius: 10px;
      background: #050b16;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #087eae;
      color: white;
      font-size: 15px;
      font-weight: bold;
    }

    button:disabled { opacity: .5; }

    .secondary { background: #17334e; }

    .note {
      margin: 22px 12px;
      color: #8198b4;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>◈ SAM AI</header>

  <div class="core"><span>SAM</span></div>
  <div id="status">PERSONAL AI ASSISTANT</div>

  <main class="chat">
    <div id="reply">नमस्ते! मैं SAM हूँ। अब मुझसे कोई सवाल पूछो।</div>

    <input
      id="message"
      type="text"
      placeholder="SAM से कुछ पूछो..."
      autocomplete="off"
    >

    <button id="send">SEND MESSAGE</button>
    <button id="voice" class="secondary">🎙️ VOICE INPUT</button>
    <button id="speak" class="secondary">🔊 READ LAST ANSWER</button>
  </main>

  <div class="note">
    SAM AI · GEMINI CONNECTION · PERSONAL ASSISTANT
  </div>

  <script>
    const API_URL =
      "https://sam-ai-brain.yashchouhan313918.workers.dev/";

    const message = document.getElementById("message");
    const reply = document.getElementById("reply");
    const status = document.getElementById("status");
    const send = document.getElementById("send");

    let lastAnswer = "";

    async function respond() {
      const text = message.value.trim();
      if (!text || send.disabled) return;

      send.disabled = true;
      status.textContent = "SAM IS THINKING...";
      reply.textContent = "सोच रहा हूँ...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.details || data.error || "Request failed");
        }

        lastAnswer = data.answer || "कोई जवाब नहीं मिला।";
        reply.textContent = lastAnswer;
        status.textContent = "SAM IS READY";
        message.value = "";
      } catch (error) {
        reply.textContent =
          "SAM अभी जवाब नहीं दे पाया। इंटरनेट कनेक्शन जाँचो। " +
          "अगर समस्या जारी रहे, तो Worker का कोड और API सेटिंग जाँचनी होगी।";
        status.textContent = "CONNECTION ERROR";
        console.error(error);
      } finally {
        send.disabled = false;
      }
    }

    send.addEventListener("click", respond);

    message.addEventListener("keydown", event => {
      if (event.key === "Enter") respond();
    });

    document.getElementById("speak").addEventListener("click", () => {
      if (!lastAnswer) {
        reply.textContent = "पहले SAM से कोई सवाल पूछो।";
        return;
      }

      if (!("speechSynthesis" in window)) {
        reply.textContent = "इस ब्राउज़र में Voice Reply उपलब्ध नहीं है।";
        return;
      }

      speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(lastAnswer);
      utterance.lang = "hi-IN";
      speechSynthesis.speak(utterance);
    });

    document.getElementById("voice").addEventListener("click", () => {
      const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!Recognition) {
        reply.textContent =
          "Voice Input उपलब्ध नहीं है। Chrome में वेबसाइट खोलकर कोशिश करो।";
        return;
      }

      const recognition = new Recognition();
      recognition.lang = "hi-IN";
      recognition.interimResults = false;

      status.textContent = "LISTENING...";

      recognition.onresult = event => {
        message.value = event.results[0][0].transcript;
        status.textContent = "MESSAGE RECEIVED";
        respond();
      };

      recognition.onerror = () => {
        status.textContent = "VOICE INPUT ERROR";
        reply.textContent =
          "माइक्रोफोन की अनुमति और इंटरनेट कनेक्शन जाँचो।";
      };

      recognition.onend = () => {
        if (status.textContent === "LISTENING...") {
          status.textContent = "SAM IS READY";
        }
      };

      try {
        recognition.start();
      } catch {
        status.textContent = "VOICE INPUT ERROR";
      }
    });
  </script>
</body>
  </html>
